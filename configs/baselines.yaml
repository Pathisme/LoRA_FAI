# Baseline Experiment Configuration
# Target hardware: NVIDIA T4 (16 GB VRAM)

model:
  name: "your-base-model"
  num_labels: 2
  trust_remote_code: false

dataset:
  name: "your-dataset"
  max_sequence_length: 512
  train_split: "train"
  validation_split: "validation"
  test_split: "test"

baselines:

  zero_shot:
    enabled: true
    description: "Evaluate pretrained model without fine-tuning"
    trainable_parameters: 0
    evaluate_only: true

  linear_probe:
    enabled: true
    description: "Train only the classification head"
    trainable_modules:
      - "classifier"
    learning_rate: 0.001
    num_train_epochs: 3
    per_device_train_batch_size: 8

  full_finetuning:
    enabled: true
    description: "Fine-tune all model parameters"
    trainable_parameters: "all"
    learning_rate: 0.00002
    num_train_epochs: 3
    per_device_train_batch_size: 2
    gradient_accumulation_steps: 4
    fp16: true

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
  save_predictions: true

output:
  results_directory: "outputs/baselines"
  save_model: true
  save_logs: true